
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khata — Payment Tracker</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #17191c;
    --muted: #737982;
    --border: #e6e8eb;
    --green: #16834b;
    --green-bg: #e9f8f0;
    --red: #d83232;
    --red-bg: #fff0f0;
    --orange: #d97706;
    --orange-bg: #fff7e8;
    --shadow: 0 8px 30px rgba(0,0,0,.06);
}

body {
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                 "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

/* APP */
.app {
    width: min(1180px, calc(100% - 32px));
    margin: auto;
    padding: 28px 0 50px;
}

/* HEADER */
.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 28px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 13px;
}

.logo {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    display: grid;
    place-items: center;
    background: #151719;
    color: white;
    font-size: 22px;
    font-weight: 800;
}

.brand h1 {
    font-size: 25px;
    letter-spacing: -.6px;
}

.brand p {
    color: var(--muted);
    font-size: 13px;
    margin-top: 2px;
}

.add-btn {
    border: 0;
    background: #151719;
    color: white;
    padding: 12px 17px;
    border-radius: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 7px;
    transition: .2s;
}

.add-btn:hover {
    transform: translateY(-1px);
    background: #27292c;
}

/* STATS */
.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 24px;
}

.stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    box-shadow: var(--shadow);
}

.stat-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.stat-label {
    font-size: 13px;
    color: var(--muted);
    font-weight: 600;
}

.stat-number {
    font-size: 28px;
    font-weight: 800;
    margin-top: 8px;
}

.stat-icon {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    font-size: 16px;
}

.stat.overdue .stat-icon {
    color: var(--red);
    background: var(--red-bg);
}

.stat.today .stat-icon {
    color: var(--orange);
    background: var(--orange-bg);
}

.stat.upcoming .stat-icon {
    color: #4169d8;
    background: #eef2ff;
}

.stat.paid .stat-icon {
    color: var(--green);
    background: var(--green-bg);
}

/* TOOLBAR */
.toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 17px;
}

.search {
    flex: 1;
    position: relative;
}

.search input {
    width: 100%;
    height: 45px;
    padding: 0 15px 0 42px;
    border: 1px solid var(--border);
    border-radius: 11px;
    outline: none;
    background: white;
    transition: .2s;
}

.search input:focus {
    border-color: #aaa;
    box-shadow: 0 0 0 3px rgba(0,0,0,.04);
}

.search-icon {
    position: absolute;
    left: 15px;
    top: 13px;
    color: #92979d;
}

.filter {
    height: 45px;
    padding: 0 13px;
    border: 1px solid var(--border);
    border-radius: 11px;
    background: white;
    outline: none;
}

/* SECTION */
.section {
    background: white;
    border: 1px solid var(--border);
    border-radius: 17px;
    box-shadow: var(--shadow);
    overflow: hidden;
}

.section-head {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.section-title {
    font-weight: 800;
    font-size: 16px;
}

.section-count {
    font-size: 12px;
    color: var(--muted);
}

/* PERSON ROW */
.person-list {
    width: 100%;
}

.person {
    display: grid;
    grid-template-columns: minmax(180px, 1.5fr) 1fr 150px 120px 105px;
    align-items: center;
    gap: 15px;
    padding: 16px 20px;
    border-bottom: 1px solid #f0f1f2;
    transition: background .15s;
}

.person:last-child {
    border-bottom: 0;
}

.person:hover {
    background: #fafafa;
}

.person.overdue {
    border-left: 4px solid var(--red);
    padding-left: 16px;
}

.person.today {
    border-left: 4px solid var(--orange);
    padding-left: 16px;
}

.person.paid {
    border-left: 4px solid var(--green);
    padding-left: 16px;
}

.person-main {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}

.avatar {
    width: 42px;
    height: 42px;
    min-width: 42px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    background: #f0f1f3;
    color: #33373b;
    font-weight: 800;
    font-size: 14px;
}

.person-name {
    font-weight: 750;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.person-note {
    color: var(--muted);
    font-size: 12px;
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.amount {
    font-weight: 800;
}

.amount small {
    color: var(--muted);
    font-size: 10px;
    font-weight: 600;
    margin-right: 3px;
}

.date {
    font-size: 13px;
    color: #44484d;
}

.date-label {
    display: block;
    color: var(--muted);
    font-size: 10px;
    margin-bottom: 2px;
}

.badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: fit-content;
    padding: 6px 9px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 800;
}

.badge.overdue {
    color: var(--red);
    background: var(--red-bg);
}

.badge.today {
    color: var(--orange);
    background: var(--orange-bg);
}

.badge.upcoming {
    color: #4169d8;
    background: #eef2ff;
}

.badge.paid {
    color: var(--green);
    background: var(--green-bg);
}

.actions {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
}

.icon-btn {
    width: 34px;
    height: 34px;
    border: 1px solid var(--border);
    background: white;
    border-radius: 9px;
    display: grid;
    place-items: center;
    font-size: 14px;
    transition: .15s;
}

.icon-btn:hover {
    background: #f3f4f5;
}

.icon-btn.delete:hover {
    color: var(--red);
    background: var(--red-bg);
    border-color: #ffd1d1;
}

.pay-btn {
    border: 0;
    background: var(--green-bg);
    color: var(--green);
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 800;
}

.pay-btn:hover {
    background: #d9f3e5;
}

/* EMPTY */
.empty {
    padding: 70px 20px;
    text-align: center;
}

.empty-icon {
    width: 58px;
    height: 58px;
    border-radius: 17px;
    background: #f2f3f5;
    margin: 0 auto 15px;
    display: grid;
    place-items: center;
    font-size: 24px;
}

.empty h3 {
    font-size: 17px;
    margin-bottom: 6px;
}

.empty p {
    color: var(--muted);
    font-size: 13px;
}

/* MODAL */
.overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,12,14,.45);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
}

.overlay.active {
    display: flex;
}

.modal {
    width: min(460px, 100%);
    background: white;
    border-radius: 19px;
    padding: 23px;
    box-shadow: 0 25px 80px rgba(0,0,0,.2);
    animation: modalIn .18s ease;
}

@keyframes modalIn {
    from {
        opacity: 0;
        transform: translateY(8px) scale(.98);
    }
    to {
        opacity: 1;
        transform: none;
    }
}

.modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 21px;
}

.modal-head h2 {
    font-size: 19px;
}

.close {
    width: 32px;
    height: 32px;
    border: 0;
    background: #f2f3f4;
    border-radius: 9px;
    font-size: 18px;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    font-size: 12px;
    font-weight: 750;
    margin-bottom: 7px;
}

.form-group input,
.form-group textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 12px;
    outline: none;
    background: #fbfbfc;
    transition: .2s;
}

.form-group input:focus,
.form-group textarea:focus {
    border-color: #999;
    background: white;
}

.form-group textarea {
    resize: vertical;
    min-height: 75px;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.modal-actions {
    display: flex;
    gap: 9px;
    margin-top: 21px;
}

.modal-actions button {
    flex: 1;
    height: 43px;
    border-radius: 10px;
    font-weight: 750;
}

.cancel-btn {
    background: #f1f2f3;
    border: 0;
}

.save-btn {
    background: #151719;
    border: 0;
    color: white;
}

/* TOAST */
.toast {
    position: fixed;
    right: 22px;
    bottom: 22px;
    background: #17191c;
    color: white;
    padding: 12px 16px;
    border-radius: 11px;
    font-size: 13px;
    font-weight: 650;
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
    transition: .25s;
    z-index: 100;
}

.toast.show {
    opacity: 1;
    transform: translateY(0);
}

/* MOBILE */
@media (max-width: 850px) {
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .person {
        grid-template-columns: 1fr auto;
        gap: 10px;
    }

    .person-main {
        grid-column: 1;
    }

    .amount {
        grid-column: 1;
        grid-row: 2;
    }

    .date {
        grid-column: 1;
        grid-row: 3;
    }

    .badge {
        grid-column: 2;
        grid-row: 1;
    }

    .actions {
        grid-column: 2;
        grid-row: 2 / span 2;
        align-self: center;
    }
}

@media (max-width: 550px) {
    .app {
        width: min(100% - 20px, 1180px);
        padding-top: 18px;
    }

    .header {
        margin-bottom: 19px;
    }

    .brand h1 {
        font-size: 21px;
    }

    .logo {
        width: 42px;
        height: 42px;
    }

    .add-btn span {
        display: none;
    }

    .add-btn {
        width: 42px;
        height: 42px;
        justify-content: center;
        padding: 0;
    }

    .toolbar {
        flex-direction: column;
    }

    .filter {
        width: 100%;
    }

    .stats {
        gap: 9px;
    }

    .stat {
        padding: 14px;
    }

    .stat-number {
        font-size: 23px;
    }

    .person {
        padding: 14px;
    }

    .person.overdue,
    .person.today,
    .person.paid {
        padding-left: 11px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <div class="brand">
            <div class="logo">K</div>
            <div>
                <h1>Khata</h1>
                <p>Payment & due-date tracker</p>
            </div>
        </div>

        <button class="add-btn" onclick="openAddModal()">
            <b>＋</b>
            <span>Add Person</span>
        </button>
    </header>

    <section class="stats">

        <div class="stat overdue">
            <div class="stat-top">
                <span class="stat-label">Overdue</span>
                <div class="stat-icon">!</div>
            </div>
            <div class="stat-number" id="overdueCount">0</div>
        </div>

        <div class="stat today">
            <div class="stat-top">
                <span class="stat-label">Due Today</span>
                <div class="stat-icon">◷</div>
            </div>
            <div class="stat-number" id="todayCount">0</div>
        </div>

        <div class="stat upcoming">
            <div class="stat-top">
                <span class="stat-label">Upcoming</span>
                <div class="stat-icon">→</div>
            </div>
            <div class="stat-number" id="upcomingCount">0</div>
        </div>

        <div class="stat paid">
            <div class="stat-top">
                <span class="stat-label">Cleared</span>
                <div class="stat-icon">✓</div>
            </div>
            <div class="stat-number" id="paidCount">0</div>
        </div>

    </section>

    <div class="toolbar">
        <div class="search">
            <span class="search-icon">⌕</span>
            <input
                id="searchInput"
                type="text"
                placeholder="Search by name..."
                oninput="render()"
            >
        </div>

        <select id="filterSelect" class="filter" onchange="render()">
            <option value="all">All people</option>
            <option value="overdue">Overdue</option>
            <option value="today">Due today</option>
            <option value="upcoming">Upcoming</option>
            <option value="paid">Cleared</option>
        </select>
    </div>

    <section class="section">

        <div class="section-head">
            <div class="section-title">Payment List</div>
            <div class="section-count" id="listCount">0 people</div>
        </div>

        <div id="personList" class="person-list"></div>

    </section>

</div>


<!-- ADD / EDIT MODAL -->
<div class="overlay" id="modalOverlay">

    <div class="modal">

        <div class="modal-head">
            <h2 id="modalTitle">Add Person</h2>
            <button class="close" onclick="closeModal()">×</button>
        </div>

        <form id="personForm">

            <div class="form-group">
                <label>Person's Name</label>
                <input
                    id="nameInput"
                    type="text"
                    placeholder="e.g. Muhammad Ahmed"
                    required
                >
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label>Amount</label>
                    <input
                        id="amountInput"
                        type="number"
                        min="0"
                        step="1"
                        placeholder="25000"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Due Date</label>
                    <input
                        id="dateInput"
                        type="date"
                        required
                    >
                </div>

            </div>

            <div class="form-group">
                <label>Note <span style="color:#999">(optional)</span></label>
                <textarea
                    id="noteInput"
                    placeholder="Any extra information..."
                ></textarea>
            </div>

            <div class="modal-actions">
                <button type="button" class="cancel-btn" onclick="closeModal()">
                    Cancel
                </button>

                <button type="submit" class="save-btn">
                    Save
                </button>
            </div>

        </form>

    </div>

</div>

<div class="toast" id="toast"></div>


<script>
/* =========================================================
   KHATA — PAYMENT TRACKER
   All data is stored locally in the browser.
   ========================================================= */

const STORAGE_KEY = "khata_payment_tracker_v1";

let people = [];
let editingId = null;


/* -----------------------------
   STORAGE
----------------------------- */

function loadData() {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (saved) {
            people = JSON.parse(saved);
        } else {
            people = [];
        }
    } catch (error) {
        console.error("Could not load data:", error);
        people = [];
    }
}


function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(people));
}


/* -----------------------------
   DATE HELPERS
----------------------------- */

function todayString() {
    const now = new Date();

    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}


function dateOnly(dateString) {
    const parts = dateString.split("-");

    return new Date(
        Number(parts[0]),
        Number(parts[1]) - 1,
        Number(parts[2])
    );
}


function getStatus(person) {

    if (person.paid) {
        return "paid";
    }

    const today = dateOnly(todayString());
    const due = dateOnly(person.dueDate);

    if (due < today) {
        return "overdue";
    }

    if (due.getTime() === today.getTime()) {
        return "today";
    }

    return "upcoming";
}


function daysDifference(dateString) {

    const today = dateOnly(todayString());
    const target = dateOnly(dateString);

    const difference = target - today;

    return Math.round(
        difference / (1000 * 60 * 60 * 24)
    );
}


/* -----------------------------
   FORMATTERS
----------------------------- */

function formatAmount(amount) {

    return new Intl.NumberFormat("en-PK").format(Number(amount));
}


function formatDate(dateString) {

    const date = dateOnly(dateString);

    return date.toLocaleDateString("en-PK", {
        day: "numeric",
        month: "short",
        year: "numeric"
    });
}


function getInitials(name) {

    return name
        .trim()
        .split(/\s+/)
        .slice(0, 2)
        .map(word => word[0])
        .join("")
        .toUpperCase();
}


/* -----------------------------
   STATUS UI
----------------------------- */

function statusBadge(person) {

    const status = getStatus(person);

    if (status === "overdue") {

        const days = Math.abs(daysDifference(person.dueDate));

        return `
            <span class="badge overdue">
                🔴 ${days} day${days === 1 ? "" : "s"} overdue
            </span>
        `;
    }

    if (status === "today") {

        return `
            <span class="badge today">
                🟠 Due today
            </span>
        `;
    }

    if (status === "paid") {

        return `
            <span class="badge paid">
                ✓ Cleared
            </span>
        `;
    }

    const days = daysDifference(person.dueDate);

    return `
        <span class="badge upcoming">
            ${days === 1 ? "Tomorrow" : `${days} days`}
        </span>
    `;
}


/* -----------------------------
   SORTING
----------------------------- */

function statusPriority(person) {

    const status = getStatus(person);

    /*
       Overdue first
       Today second
       Upcoming third
       Cleared last
    */

    if (status === "overdue") return 1;
    if (status === "today") return 2;
    if (status === "upcoming") return 3;
    if (status === "paid") return 4;

    return 5;
}


function sortPeople(list) {

    return [...list].sort((a, b) => {

        const statusA = statusPriority(a);
        const statusB = statusPriority(b);

        if (statusA !== statusB) {
            return statusA - statusB;
        }

        /*
           Within overdue/upcoming:
           earliest due date first.
        */

        if (statusA !== 4) {
            return a.dueDate.localeCompare(b.dueDate);
        }

        /*
           Cleared:
           newest payment first.
        */

        return (b.paidAt || "").localeCompare(a.paidAt || "");
    });
}


/* -----------------------------
   RENDER
----------------------------- */

function render() {

    updateStats();

    const list = document.getElementById("personList");

    const search =
        document.getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();

    const filter =
        document.getElementById("filterSelect").value;

    let filtered = people.filter(person => {

        const matchesSearch =
            person.name.toLowerCase().includes(search);

        const status = getStatus(person);

        const matchesFilter =
            filter === "all" ||
            status === filter;

        return matchesSearch && matchesFilter;
    });

    filtered = sortPeople(filtered);

    document.getElementById("listCount").textContent =
        `${filtered.length} ${filtered.length === 1 ? "person" : "people"}`;

    if (filtered.length === 0) {

        list.innerHTML = `
            <div class="empty">
                <div class="empty-icon">📒</div>
                <h3>
                    ${people.length === 0
                        ? "Your khata is empty"
                        : "No people found"}
                </h3>
                <p>
                    ${people.length === 0
                        ? "Add someone to start tracking their payment."
                        : "Try changing your search or filter."}
                </p>
            </div>
        `;

        return;
    }

    list.innerHTML = filtered
        .map(person => createPersonHTML(person))
        .join("");
}


function createPersonHTML(person) {

    const status = getStatus(person);

    return `
        <div class="person ${status}">

            <div class="person-main">

                <div class="avatar">
                    ${escapeHTML(getInitials(person.name))}
                </div>

                <div style="min-width:0">

                    <div class="person-name">
                        ${escapeHTML(person.name)}
                    </div>

                    ${
                        person.note
                        ? `
                            <div class="person-note">
                                ${escapeHTML(person.note)}
                            </div>
                        `
                        : ""
                    }

                </div>

            </div>


            <div class="amount">
                <small>Rs.</small>
                ${formatAmount(person.amount)}
            </div>


            <div class="date">
                <span class="date-label">
                    ${status === "paid" ? "Paid" : "Due date"}
                </span>

                ${
                    status === "paid"
                    ? formatDate(person.paidAtDate || person.dueDate)
                    : formatDate(person.dueDate)
                }
            </div>


            <div>
                ${statusBadge(person)}
            </div>


            <div class="actions">

                ${
                    status !== "paid"
                    ? `
                        <button
                            class="pay-btn"
                            onclick="markPaid('${person.id}')"
                            title="Mark as paid"
                        >
                            Paid
                        </button>
                    `
                    : `
                        <button
                            class="icon-btn"
                            onclick="markUnpaid('${person.id}')"
                            title="Mark as unpaid"
                        >
                            ↩
                        </button>
                    `
                }

                <button
                    class="icon-btn"
                    onclick="editPerson('${person.id}')"
                    title="Edit"
                >
                    ✎
                </button>

                <button
                    class="icon-btn delete"
                    onclick="deletePerson('${person.id}')"
                    title="Delete"
                >
                    ×
                </button>

            </div>

        </div>
    `;
}


/* -----------------------------
   STATS
----------------------------- */

function updateStats() {

    let overdue = 0;
    let today = 0;
    let upcoming = 0;
    let paid = 0;

    people.forEach(person => {

        const status = getStatus(person);

        if (status === "overdue") overdue++;
        if (status === "today") today++;
        if (status === "upcoming") upcoming++;
        if (status === "paid") paid++;
    });

    document.getElementById("overdueCount").textContent = overdue;
    document.getElementById("todayCount").textContent = today;
    document.getElementById("upcomingCount").textContent = upcoming;
    document.getElementById("paidCount").textContent = paid;
}


/* -----------------------------
   MODAL
----------------------------- */

function openAddModal() {

    editingId = null;

    document.getElementById("modalTitle").textContent =
        "Add Person";

    document.getElementById("personForm").reset();

    /*
       Default due date = today
       but user can change it.
    */

    document.getElementById("dateInput").value =
        todayString();

    document.getElementById("modalOverlay")
        .classList.add("active");

    setTimeout(() => {
        document.getElementById("nameInput").focus();
    }, 100);
}


function closeModal() {

    document.getElementById("modalOverlay")
        .classList.remove("active");

    editingId = null;
}


/* -----------------------------
   ADD / EDIT
----------------------------- */

document.getElementById("personForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        const name =
            document.getElementById("nameInput")
                .value
                .trim();

        const amount =
            Number(
                document.getElementById("amountInput")
                    .value
            );

        const dueDate =
            document.getElementById("dateInput")
                .value;

        const note =
            document.getElementById("noteInput")
                .value
                .trim();

        if (!name || !amount || !dueDate) {
            return;
        }

        if (editingId) {

            const person =
                people.find(p => p.id === editingId);

            if (person) {

                person.name = name;
                person.amount = amount;
                person.dueDate = dueDate;
                person.note = note;
            }

            showToast("Person updated ✓");

        } else {

            const person = {

                id:
                    Date.now().toString(36) +
                    Math.random()
                        .toString(36)
                        .slice(2),

                name,
                amount,
                dueDate,
                note,

                paid: false,
                paidAt: null,
                paidAtDate: null
            };

            people.push(person);

            showToast("Person added ✓");
        }

        saveData();
        render();
        closeModal();
    });


/* -----------------------------
   EDIT
----------------------------- */

function editPerson(id) {

    const person =
        people.find(p => p.id === id);

    if (!person) return;

    editingId = id;

    document.getElementById("modalTitle").textContent =
        "Edit Person";

    document.getElementById("nameInput").value =
        person.name;

    document.getElementById("amountInput").value =
        person.amount;

    document.getElementById("dateInput").value =
        person.dueDate;

    document.getElementById("noteInput").value =
        person.note || "";

    document.getElementById("modalOverlay")
        .classList.add("active");
}


/* -----------------------------
   MARK PAID
----------------------------- */

function markPaid(id) {

    const person =
        people.find(p => p.id === id);

    if (!person) return;

    person.paid = true;

    person.paidAt =
        new Date().toISOString();

    person.paidAtDate =
        todayString();

    saveData();
    render();

    showToast(`${person.name} marked as cleared ✓`);
}


/* -----------------------------
   MARK UNPAID
----------------------------- */

function markUnpaid(id) {

    const person =
        people.find(p => p.id === id);

    if (!person) return;

    person.paid = false;
    person.paidAt = null;
    person.paidAtDate = null;

    saveData();
    render();

    showToast(`${person.name} moved back to due`);
}


/* -----------------------------
   DELETE
----------------------------- */

function deletePerson(id) {

    const person =
        people.find(p => p.id === id);

    if (!person) return;

    const confirmed =
        confirm(
            `Delete ${person.name} from your khata?`
        );

    if (!confirmed) return;

    people =
        people.filter(p => p.id !== id);

    saveData();
    render();

    showToast("Person deleted");
}


/* -----------------------------
   ESCAPE HTML
----------------------------- */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* -----------------------------
   TOAST
----------------------------- */

let toastTimer;

function showToast(message) {

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(() => {
            toast.classList.remove("show");
        }, 2500);
}


/* -----------------------------
   MODAL EVENTS
----------------------------- */

document
    .getElementById("modalOverlay")
    .addEventListener("click", function(event) {

        if (event.target === this) {
            closeModal();
        }
    });


document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {
        closeModal();
    }

});


/* -----------------------------
   INITIALIZE
----------------------------- */

loadData();
render();

/*
   Re-render every minute so the UI
   updates automatically when the date
   changes while the page is open.
*/

setInterval(() => {
    render();
}, 60 * 1000);

</script>

</body>
</html>
